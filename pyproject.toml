[project]
name = "migration-laya"
version = "0.1.0"
description = "Discovery: Laya as a classifier for SQL migration triage"
requires-python = ">=3.10,<3.13"
dependencies = [
    "sqlglot>=25.0.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
laya = ["laya>=0.3.9"]
dev = ["pytest>=8.0"]

[project.scripts]
mlaya = "migration_laya.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/migration_laya"]

[tool.pytest.ini_options]
testpaths = ["tests"]
