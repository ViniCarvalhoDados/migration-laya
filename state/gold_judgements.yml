# Blind gold labels for the two judgement questions, written by Claude after
# reading each SQL file and BEFORE any Laya call was made. Recorded here as a
# separate, reviewable artefact so a human can disagree with a specific call
# without touching the deterministic labels.
#
# Keyed by the ORIGIN query name, not by the sequential script id: the id is
# assigned by the sampler and shifts whenever the sample size changes, which
# would silently attach a judgement to the wrong script.
#
# `purpose` is the only part of the evidence card an LLM writes; the rest is
# generated from the AST.
#
# Rule applied for `needs_human_review`: true when migrating requires a decision
# a converter cannot make safely — semantics that differ across engines
# (ROLLUP/GROUPING null handling, interval arithmetic), an anti-pattern that
# should be rewritten rather than translated, or a multi-fact join whose results
# must be revalidated. Mechanical translation alone is false.

query42:
  purpose: >-
    Ranks total store sales revenue by item category for one calendar month,
    restricted to the products of a single item manager.
  rewrite_strategy: lift_and_shift
  needs_human_review: false
  rationale: >-
    Three-table star join, one SUM, plain ANSI syntax and no subqueries. Nothing
    here behaves differently on a cloud warehouse; a syntax-level conversion is
    enough.

query27:
  purpose: >-
    Averages quantity, list price, coupon amount and sale price for one customer
    demographic segment in one state, subtotalled by item and state.
  rewrite_strategy: lift_and_shift
  needs_human_review: true
  rationale: >-
    Mechanically simple five-table star join, but GROUP BY ROLLUP with an
    explicit GROUPING() flag is the one part that does not travel unchanged:
    engines differ on how subtotal rows and their NULLs surface, so the output
    needs revalidating even though the SQL itself converts cleanly.

query13:
  purpose: >-
    Averages store sale quantity, price and wholesale cost for narrow
    combinations of customer demographics, household size, address state and
    profit range.
  rewrite_strategy: refactor
  needs_human_review: true
  rationale: >-
    No subqueries and no window functions, but the filter is two large
    OR-of-AND blocks that repeat the same join predicates inside every branch.
    Translating it literally carries the bad plan across; it is normally
    restructured into UNION branches or a disjunctive normal form first.

query40:
  purpose: >-
    Compares catalog sales net of refunds before and after a fixed pivot date,
    by warehouse state and item.
  rewrite_strategy: refactor
  needs_human_review: true
  rationale: >-
    Mixes an explicit LEFT OUTER JOIN with comma-style implicit joins in the
    same FROM clause, which several engines either reject or associate
    differently. Combined with INTERVAL date arithmetic and COALESCE over the
    outer-join side, the null semantics need checking rather than assuming.

query47:
  purpose: >-
    Flags month-store-brand combinations whose sales deviate more than ten
    percent from their yearly average, alongside the previous and next month.
  rewrite_strategy: refactor
  needs_human_review: true
  rationale: >-
    Self-joins the same CTE three times on rank+1 and rank-1 to emulate LAG and
    LEAD. A faithful translation preserves an expensive anti-pattern the target
    engine supports natively, so this should be rewritten rather than converted.

query25:
  purpose: >-
    Reports peak store sale profit, store return loss and catalog sale profit
    per item and store, matching returns and later catalog purchases to the
    original sale.
  rewrite_strategy: lift_and_shift
  needs_human_review: false
  rationale: >-
    A wide eight-way join using three aliases of the date dimension, but it is
    plain ANSI throughout with no subqueries, windows or set operations. Width
    is not the same as migration risk here.

query76:
  purpose: >-
    Counts and totals sales whose demographic or warehouse key is missing,
    across the store, web and catalog channels, by year, quarter and category.
  rewrite_strategy: lift_and_shift
  needs_human_review: false
  rationale: >-
    Scores high on structure because of the three-branch UNION ALL inside a
    derived table, but every branch is the same simple three-table join and the
    syntax is portable. A useful case where high complexity does not imply a
    hard migration.

query64:
  purpose: >-
    Finds items bought in consecutive years by the same customer and compares
    their price and quantity between the two years, with buyer address, income
    band and demographics on both sides.
  rewrite_strategy: redesign
  needs_human_review: true
  rationale: >-
    An eighteen-source join carrying paired aliases of five different dimensions
    (two date, two demographic, two household, two address, two income band),
    feeding a self-join of the resulting CTE. The join graph, not the syntax, is
    the migration cost; it has to be reasoned through rather than converted.

query66:
  purpose: >-
    Pivots warehouse shipping sales and net revenue into one column per calendar
    month for the web and catalog channels.
  rewrite_strategy: refactor
  needs_human_review: true
  rationale: >-
    Three hundred lines that are almost entirely forty-eight repeated CASE
    expressions implementing a hand-rolled month pivot, doubled by a UNION ALL.
    Target engines express this as a PIVOT in a fraction of the code; carrying
    the CASE ladder across preserves a maintenance problem.

query14:
  purpose: >-
    Totals sales and quantity for items sold through all three channels in the
    same period, keeping only sales above the overall average, subtotalled by
    channel, brand, class and category.
  rewrite_strategy: redesign
  needs_human_review: true
  rationale: >-
    Two statements in one file, four CTEs, chained INTERSECTs to find the common
    item set, a correlated comparison against a UNION-derived average, and a
    final ROLLUP. Several of these interact, so the pieces cannot be converted
    independently and the result set must be validated end to end.

